<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Test</title>
    <style>
        body {
            font-family: system-ui;
            padding: 20px;
            background: #f8fafc;
        }
        .status { padding: 10px; margin: 10px 0; border-radius: 8px; }
        .success { background: #d1fae5; color: #065f46; }
        .error { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <h1>Build Test</h1>
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        function log(message, isError = false) {
            const div = document.createElement('div');
            div.className = `status ${isError ? 'error' : 'success'}`;
            div.textContent = message;
            results.appendChild(div);
        }
        
        // Test 1: Check if main JS file exists
        fetch('/assets/index-CMghZRnx.js')
            .then(res => {
                if (res.ok) {
                    log('✓ Main JS file exists');
                } else {
                    log('✗ Main JS file not found (404)', true);
                }
            })
            .catch(err => log('✗ Error fetching JS: ' + err.message, true));
        
        // Test 2: Check if CSS file exists
        fetch('/assets/index-vHeU4iwV.css')
            .then(res => {
                if (res.ok) {
                    log('✓ CSS file exists');
                } else {
                    log('✗ CSS file not found (404)', true);
                }
            })
            .catch(err => log('✗ Error fetching CSS: ' + err.message, true));
        
        // Test 3: Check if root element exists
        if (document.getElementById('root')) {
            log('✓ Root element exists');
        } else {
            log('✗ Root element not found', true);
        }
        
        // Test 4: Try to load the actual app
        setTimeout(() => {
            const script = document.createElement('script');
            script.type = 'module';
            script.src = '/assets/index-CMghZRnx.js';
            script.onload = () => log('✓ Main JS loaded successfully');
            script.onerror = () => log('✗ Main JS failed to load', true);
            document.body.appendChild(script);
        }, 1000);
    </script>
</body>
</html>
