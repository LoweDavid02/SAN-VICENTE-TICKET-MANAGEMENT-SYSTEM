<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Barangay Connect — Centralized service request and incident management platform for Barangay San Vicente, Apalit, Pampanga." />
    <meta name="theme-color" content="#14b8a6" />

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BSV CMS" />
    
    <!-- iOS Splash Screens -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-startup-image" href="/icons/icon-512.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />

    <title>Barangay Connect — San Vicente</title>

    <!--
      Fonts: loaded from Google Fonts with display=swap.
      font-display:swap is set in the URL so text is visible immediately.
      Preconnect hints reduce DNS + TLS handshake time.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <!-- Fallback for no-JS -->
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap"
      />
    </noscript>

    <!--
      Critical inline CSS — prevents FOUC (flash of unstyled content).
      Only the absolute minimum needed before the main CSS loads.
    -->
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html{height:100%;scroll-behavior:smooth}
      body{
        font-family:'DM Sans',system-ui,-apple-system,sans-serif;
        background:#f8fafc;color:#0f172a;
        -webkit-font-smoothing:antialiased;
        min-height:100vh;overflow-x:hidden;
      }
      #root{min-height:100vh}
      /* Prevent layout shift while fonts load */
      @font-face{font-family:'DM Sans';font-display:swap}
      @font-face{font-family:'DM Serif Display';font-display:swap}
      /* Spinner for initial load */
      @keyframes _spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Module script — browser only downloads if ES modules supported -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
