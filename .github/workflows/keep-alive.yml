name: Keep Render Services Alive

on:
  schedule:
    # Run every 10 minutes during active hours (6 AM - 11 PM UTC)
    # This prevents cold starts on Render free tier
    - cron: '*/10 6-23 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping-services:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Laravel API Health Check
        run: |
          echo "Pinging Laravel API..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_API_URL }}/api/ping")
          echo "API Response Code: $HTTP_CODE"
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ API is alive"
          else
            echo "⚠️ API returned $HTTP_CODE"
          fi
        continue-on-error: true

      - name: Ping React Frontend
        run: |
          echo "Pinging React Frontend..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_FRONTEND_URL }}")
          echo "Frontend Response Code: $HTTP_CODE"
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Frontend is alive"
          else
            echo "⚠️ Frontend returned $HTTP_CODE"
          fi
        continue-on-error: true

      - name: Summary
        run: |
          echo "Keep-alive ping completed at $(date)"
          echo "This workflow runs every 10 minutes during active hours (6 AM - 11 PM UTC)"
          echo "to prevent Render free-tier cold starts."
