name: Keep Supabase Alive

on:
  schedule:
    # Run every 5 days to prevent Supabase free-tier from pausing
    # Supabase pauses after 7 days of inactivity
    - cron: '0 12 */5 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent pausing
        run: |
          echo "Pinging Supabase..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase Response Code: $HTTP_CODE"
          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 401 ]; then
            echo "✅ Supabase is alive (401 is expected without valid auth)"
          else
            echo "⚠️ Supabase returned $HTTP_CODE"
          fi
        continue-on-error: true

      - name: Summary
        run: |
          echo "Supabase keep-alive ping completed at $(date)"
          echo "This workflow runs every 5 days to prevent Supabase from pausing."
          echo "Note: This workflow is optional and only needed if you're using Supabase."
