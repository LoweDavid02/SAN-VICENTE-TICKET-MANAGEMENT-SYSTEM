# render.yaml — Barangay Connect deployment on Render.com
# Defines both the Laravel API (Docker) and React frontend (static site)
#
# Deploy steps:
# 1. Push this repo to GitHub
# 2. Go to https://dashboard.render.com → New → Blueprint
# 3. Connect your GitHub repo — Render reads this file automatically
# 4. Set the environment variables listed below in the Render dashboard

services:

  # ── Laravel API (Docker) ──────────────────────────────────────────────────
  - type: web
    name: barangay-connect-api
    runtime: docker
    dockerfilePath: ./LARAVEL-BACK-END/Dockerfile
    dockerContext: ./LARAVEL-BACK-END
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Barangay Connect"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true          # Render generates a secure key automatically
      - key: APP_URL
        fromService:
          type: web
          name: barangay-connect-api
          property: host
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: barangay-connect-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: barangay-connect-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: barangay-connect-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: barangay-connect-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: barangay-connect-db
          property: password
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: FRONTEND_URL
        value: https://san-vicente-ticket-management-system-90eq.onrender.com

  # ── React Frontend (Static Site) ─────────────────────────────────────────
  - type: web
    name: barangay-connect-frontend
    runtime: static
    buildCommand: cd REACT-FRONT-END && npm install && npm run build
    staticPublishPath: ./REACT-FRONT-END/dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: barangay-connect-api
          property: host
        transform: "https://$VALUE/api/v1"

# ── PostgreSQL Database ───────────────────────────────────────────────────
databases:
  - name: barangay-connect-db
    plan: free
    databaseName: barangay_connect
    user: barangay_user
