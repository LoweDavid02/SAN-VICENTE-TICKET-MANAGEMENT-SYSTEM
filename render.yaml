# render.yaml — Barangay Connect
# Defines: PostgreSQL DB + Laravel API + React Frontend

services:

  # ── 1. Laravel API (Docker) ───────────────────────────────────────────────
  - type: web
    name: san-vicente-api
    runtime: docker
    dockerfilePath: ./LARAVEL-BACK-END/Dockerfile
    dockerContext: ./LARAVEL-BACK-END
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Barangay Connect"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://san-vicente-api.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: san-vicente-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: san-vicente-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: san-vicente-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: san-vicente-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: san-vicente-db
          property: password
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      - key: FRONTEND_URL
        value: https://san-vicente-frontend.onrender.com
      - key: SANCTUM_STATEFUL_DOMAINS
        value: san-vicente-frontend.onrender.com

  # ── 2. React Frontend (Static Site) ──────────────────────────────────────
  - type: web
    name: san-vicente-frontend
    runtime: static
    buildCommand: cd REACT-FRONT-END && npm install && npm run build
    staticPublishPath: ./REACT-FRONT-END/dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://san-vicente-api.onrender.com/api/v1

# ── 3. PostgreSQL Database ────────────────────────────────────────────────
databases:
  - name: san-vicente-db
    plan: free
    databaseName: barangay_connect
    user: barangay_user
